<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        var t = localStorage.getItem('certpath_theme');
        var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', t ? t === 'dark' : d);
      })();
    </script>
    <script>
      (function() {
        const p = new URLSearchParams(window.location.search).get('p');
        if (p) {
          window.history.replaceState(
            null, null,
            '/certpath-ai' + decodeURIComponent(p)
          );
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CertPath AI — Ace Your Next Certification</title>
    <meta name="description" content="AI-powered prep for the certifications that advance your career. CCXP, PMP, AWS CCP, PSM I, ITIL 4 and more." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
